[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coreyheral-cutoffsniff"
version = "0.1.0"
description = "通过句子完整性、括号配对、列表项收尾特征判断输出是否中途终止"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "coreyheral" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://coreyheral.github.io"
Repository = "https://github.com/coreyheral/cutoffsniff"
Issues = "https://github.com/coreyheral/cutoffsniff/issues"

[project.scripts]
cutoffsniff = "cutoffsniff:main"

[tool.setuptools]
py-modules = ["cutoffsniff"]
